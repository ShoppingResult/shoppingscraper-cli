name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write   # required for npm provenance
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: test
        run: npm test

      - name: build
        run: npm run build

      # ---------------------------------------------------------------
      # Pre-publish secret tripwire — fails the job if any UUID-shaped
      # string or `api_key=<value>` literal appears in the npm tarball.
      # ---------------------------------------------------------------
      - name: tarball secret tripwire
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          npm pack
          tarball=$(ls *.tgz | head -1)
          mkdir -p /tmp/tarball
          tar -xzf "$tarball" -C /tmp/tarball
          if grep -RE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/tarball/package; then
            echo "::error::UUID-shaped string found in tarball — possible API key leak."
            exit 1
          fi
          if grep -RE 'api[_-]?key=[A-Za-z0-9_-]{8,}' /tmp/tarball/package; then
            echo "::error::api_key=<value> literal found in tarball."
            exit 1
          fi
          if grep -RE 'sk-[A-Za-z0-9_-]{20,}|ssc_[A-Za-z0-9_-]{20,}' /tmp/tarball/package; then
            echo "::error::API-key-like prefix found in tarball."
            exit 1
          fi
          echo "tarball clean."

      # Publish step runs only when NPM_TOKEN is configured as a repo secret.
      # Until the @shoppingscraper npm org exists and an NPM_TOKEN is added,
      # this step is silently skipped so the rest of the workflow (typecheck,
      # tests, build, tarball tripwire) still gates every push to main.
      - name: changesets — version + publish
        if: ${{ secrets.NPM_TOKEN != '' }}
        uses: changesets/action@v1
        with:
          publish: npm publish --provenance --access public
          version: npm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publish skipped notice
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: |
          echo "::notice::NPM_TOKEN not configured — skipping npm publish."
          echo "To enable: create the @shoppingscraper npm org, generate an"
          echo "automation token, then add it as a repo secret named NPM_TOKEN."
